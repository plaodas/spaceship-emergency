id: FLT-057
name: 右舷給電レグの共有点の飽和
symptoms: 右舷給電レグの共有点の飽和が、通信ロックの維持に基準から外れる。外れは右舷給電レグの監視点に留まり、零点母線の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯37の記録に残る。
cause: 右舷給電レグの内部状態が共有点の飽和を維持し、零点母線へは同じ偏差を伝えない。
severity: 3
systems: power
derived:
  - FLT-084
components:
  - starboard_power_leg
triggers:
  - comms_active
role: bridge
confusers: []
discriminators:
  - 通信ロックの維持以外では右舷給電レグの共有点の飽和は再現しない。
