id: FLT-014
name: 反物質消費センサーの表示だけの変化
symptoms: 反物質消費センサーの表示だけの変化が、高出力の給電に基準から外れる。外れは反物質消費センサーの監視点に留まり、位相センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯10の記録に残る。
cause: 反物質消費センサーの内部状態が表示だけの変化を維持し、位相センサーへは同じ偏差を伝えない。
severity: 1
systems: sensors
derived:
  - FLT-001
components:
  - consumption_sensor
triggers:
  - high_power
role: sensor_lie
confusers: []
discriminators:
  - 高出力の給電以外では反物質消費センサーの表示だけの変化は再現しない。
