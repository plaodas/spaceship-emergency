id: FLT-059
name: 右舷居住区ダクトの境界の脈動
symptoms: 右舷居住区ダクトの境界の脈動が、熱パルスのあとに基準から外れる。外れは右舷居住区ダクトの監視点に留まり、左舷居住区ダクトの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯39の記録に残る。
cause: 右舷居住区ダクトの内部状態が境界の脈動を維持し、左舷居住区ダクトへは同じ偏差を伝えない。
severity: 5
systems: life_support
derived:
  - FLT-088
components:
  - starboard_habitat_duct
  - atmosphere_loop
triggers:
  - after_heat_pulse
role: bridge
confusers: []
discriminators:
  - 熱パルスのあと以外では右舷居住区ダクトの境界の脈動は再現しない。
