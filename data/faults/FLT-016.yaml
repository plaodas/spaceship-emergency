id: FLT-016
name: 右舷折畳みコイルの見かけの偏差
symptoms: 右舷折畳みコイルの見かけの偏差が、姿勢変更に基準から外れる。外れは右舷折畳みコイルの監視点に留まり、左舷トリムコイルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯12の記録に残る。
cause: 右舷折畳みコイルの内部状態が見かけの偏差を維持し、左舷トリムコイルへは同じ偏差を伝えない。
severity: 3
systems: fold
derived:
  - FLT-018
components:
  - starboard_fold_coil
triggers:
  - maneuver
role: confounder
confusers: []
discriminators:
  - 姿勢変更以外では右舷折畳みコイルの見かけの偏差は再現しない。
