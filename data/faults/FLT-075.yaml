id: FLT-075
name: 左舷慣性ダンパーの脈動
symptoms: 左舷慣性ダンパーの脈動が、対消滅の燃焼に基準から外れる。外れは左舷慣性ダンパーの監視点に留まり、擬似重力甲板の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯49の記録に残る。
cause: 左舷慣性ダンパーの内部状態が脈動を維持し、擬似重力甲板へは同じ偏差を伝えない。
severity: 5
systems: gravity
derived:
  - FLT-076
components:
  - port_damper
triggers:
  - during_burn
role: local
confusers: []
discriminators:
  - 対消滅の燃焼以外では左舷慣性ダンパーの脈動は再現しない。
