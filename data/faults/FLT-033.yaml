id: FLT-033
name: 右舷折畳みコイルの別原因の重なり
symptoms: 右舷折畳みコイルの別原因の重なりが、通信ロックの維持に基準から外れる。外れは右舷折畳みコイルの監視点に留まり、左舷トリムコイルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯21の記録に残る。
cause: 右舷折畳みコイルの内部状態が別原因の重なりを維持し、左舷トリムコイルへは同じ偏差を伝えない。
severity: 2
systems: fold
derived:
  - FLT-036
components:
  - starboard_fold_coil
triggers:
  - comms_active
role: confounder
confusers: []
discriminators:
  - 通信ロックの維持以外では右舷折畳みコイルの別原因の重なりは再現しない。
