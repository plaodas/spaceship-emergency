id: FLT-019
name: 折畳み復帰後の駆動位相ずれ
symptoms: 右舷折畳みコイルの駆動位相が、折畳みから戻った短い時間だけずれる。ずれているあいだコイルの温度指示は基準のままである。位相は駆動が静まると基準へ戻る。同じ偏差は当該部品の記録に残る。
cause: 復帰直後の残渣位相が、コイルの駆動基準をずらす。
severity: 2
systems: fold
