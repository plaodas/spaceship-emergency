id: FLT-098
name: 左舷外板の位相のずれ
symptoms: 左舷外板の位相のずれが、シールド展開に基準から外れる。外れは左舷外板の監視点に留まり、構造健全性フィールドの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯67の記録に残る。
cause: 左舷外板の内部状態が位相のずれを維持し、構造健全性フィールドへは同じ偏差を伝えない。
severity: 3
systems: hull
