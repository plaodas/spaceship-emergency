id: FLT-017
name: 右舷折畳みコイルの復帰残熱
symptoms: 超光速の航法を終えて通常空間へ戻ったあと、90秒から180秒のあいだ、右舷外板温度が左舷より高くなる。熱の源は右舷主コイルの励磁が崩れたあとに残る熱である。暗黒熱バスがこの熱を受け取っていれば、温度差は計器上に留まり、乗員が船体表面の熱として感じるには至らない。
cause: 右舷主コイルは折畳みの主負荷を担う。通常空間への復帰時、励磁の崩れが左舷トリムコイルより大きく、短時間の残熱が右舷へ出る。
severity: 2
systems: fold
derived:
  - FLT-044
components:
  - starboard_fold_coil
triggers:
  - after_jump
role: local
confusers:
  - FLT-052
  - FLT-061
discriminators:
  - 右舷外板温度が左舷より高い。
  - 時間窓は通常空間へ戻ったあと90〜180秒。
  - 左舷外板は同じ窓では同程度まで上がらない。
