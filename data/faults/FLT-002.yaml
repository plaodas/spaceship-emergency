id: FLT-002
name: 位相センサーの表示だけの変化
symptoms: 位相センサーの表示だけの変化が、高出力の給電に基準から外れる。外れは位相センサーの監視点に留まり、外板温度センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯2の記録に残る。
cause: 位相センサーの内部状態が表示だけの変化を維持し、外板温度センサーへは同じ偏差を伝えない。
severity: 3
systems: sensors
derived:
  - FLT-003
components:
  - phase_sensor
triggers:
  - high_power
role: sensor_lie
confusers: []
discriminators:
  - 高出力の給電以外では位相センサーの表示だけの変化は再現しない。
