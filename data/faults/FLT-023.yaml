id: FLT-023
name: もつれ対バンクの時刻の一致
symptoms: もつれ対バンクの時刻の一致が、熱パルスのあとに基準から外れる。外れはもつれ対バンクの監視点に留まり、位相ロックアレイの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯15の記録に残る。
cause: もつれ対バンクの内部状態が時刻の一致を維持し、位相ロックアレイへは同じ偏差を伝えない。
severity: 1
systems: comms
