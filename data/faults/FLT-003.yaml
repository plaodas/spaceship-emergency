id: FLT-003
name: 外板温度センサーの基準点の移動
symptoms: 外板温度センサーの基準点の移動が、シールド展開に基準から外れる。外れは外板温度センサーの監視点に留まり、反物質消費センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯3の記録に残る。
cause: 外板温度センサーの内部状態が基準点の移動を維持し、反物質消費センサーへは同じ偏差を伝えない。
severity: 4
systems: sensors
derived:
  - FLT-004
components:
  - hull_temp_sensor
triggers:
  - shield_on
role: sensor_lie
confusers: []
discriminators:
  - シールド展開以外では外板温度センサーの基準点の移動は再現しない。
