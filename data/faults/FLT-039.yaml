id: FLT-039
name: もつれ対バンクの境界の脈動
symptoms: もつれ対バンクの境界の脈動が、シールド展開に基準から外れる。外れはもつれ対バンクの監視点に留まり、位相ロックアレイの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯27の記録に残る。
cause: もつれ対バンクの内部状態が境界の脈動を維持し、位相ロックアレイへは同じ偏差を伝えない。
