id: FLT-080
name: もつれ対バンクの密封の漏れ
symptoms: もつれ対バンクの密封の漏れが、折畳みの途中に基準から外れる。外れはもつれ対バンクの監視点に留まり、位相ロックアレイの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯54の記録に残る。
cause: もつれ対バンクの内部状態が密封の漏れを維持し、位相ロックアレイへは同じ偏差を伝えない。
severity: 5
systems: comms
derived:
  - FLT-081
components:
  - entanglement_bank
triggers:
  - during_jump
role: local
confusers: []
discriminators:
  - 折畳みの途中以外ではもつれ対バンクの密封の漏れは再現しない。
