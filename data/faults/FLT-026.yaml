id: FLT-026
name: 右舷居住区ダクトの同時に見える揺れ
symptoms: 右舷居住区ダクトの同時に見える揺れが、高出力の給電に基準から外れる。外れは右舷居住区ダクトの監視点に留まり、左舷居住区ダクトの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯18の記録に残る。
cause: 右舷居住区ダクトの内部状態が同時に見える揺れを維持し、左舷居住区ダクトへは同じ偏差を伝えない。
severity: 4
systems: life_support
derived:
  - FLT-042
components:
  - starboard_habitat_duct
triggers:
  - high_power
role: confounder
confusers: []
discriminators:
  - 高出力の給電以外では右舷居住区ダクトの同時に見える揺れは再現しない。
