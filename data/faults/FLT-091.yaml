id: FLT-091
name: 左舷居住区ダクトの同期外れ
symptoms: 左舷居住区ダクトの同期外れが、通信ロックの維持に基準から外れる。外れは左舷居住区ダクトの監視点に留まり、大気循環の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯61の記録に残る。
cause: 左舷居住区ダクトの内部状態が同期外れを維持し、大気循環へは同じ偏差を伝えない。
severity: 2
systems: life_support
derived:
  - FLT-092
components:
  - port_habitat_duct
triggers:
  - comms_active
role: local
confusers: []
discriminators:
  - 通信ロックの維持以外では左舷居住区ダクトの同期外れは再現しない。
