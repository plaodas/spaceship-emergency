id: FLT-042
name: 右舷居住区ダクトの受け渡しの遅れ
symptoms: 右舷居住区ダクトの受け渡しの遅れが、折畳みの途中に基準から外れる。外れは右舷居住区ダクトの監視点に留まり、左舷居住区ダクトの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯30の記録に残る。
cause: 右舷居住区ダクトの内部状態が受け渡しの遅れを維持し、左舷居住区ダクトへは同じ偏差を伝えない。
severity: 1
systems: life_support
derived:
  - FLT-059
components:
  - starboard_habitat_duct
  - atmosphere_loop
triggers:
  - during_jump
role: bridge
confusers: []
discriminators:
  - 折畳みの途中以外では右舷居住区ダクトの受け渡しの遅れは再現しない。
