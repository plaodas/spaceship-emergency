id: FLT-079
name: デコヒーレンス遮蔽の同期外れ
symptoms: デコヒーレンス遮蔽の同期外れが、通信ロックの維持に基準から外れる。外れはデコヒーレンス遮蔽の監視点に留まり、もつれ対バンクの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯53の記録に残る。
cause: デコヒーレンス遮蔽の内部状態が同期外れを維持し、もつれ対バンクへは同じ偏差を伝えない。
severity: 4
systems: comms
derived:
  - FLT-080
components:
  - decoherence_shield
triggers:
  - comms_active
role: local
confusers: []
discriminators:
  - 通信ロックの維持以外ではデコヒーレンス遮蔽の同期外れは再現しない。
