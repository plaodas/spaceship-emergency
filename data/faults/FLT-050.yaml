id: FLT-050
name: 右舷折畳みコイルの共有点の飽和
symptoms: 右舷折畳みコイルの共有点の飽和が、対消滅の燃焼に基準から外れる。外れは右舷折畳みコイルの監視点に留まり、左舷トリムコイルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯33の記録に残る。
cause: 右舷折畳みコイルの内部状態が共有点の飽和を維持し、左舷トリムコイルへは同じ偏差を伝えない。
severity: 4
systems: fold
derived:
  - FLT-068
components:
  - starboard_fold_coil
  - mass_shadow_compensator
triggers:
  - during_burn
role: bridge
confusers: []
discriminators:
  - 対消滅の燃焼以外では右舷折畳みコイルの共有点の飽和は再現しない。
