id: FLT-040
name: 零点母線の境界での滞り
symptoms: 零点母線の境界での滞りが、姿勢変更に基準から外れる。外れは零点母線の監視点に留まり、右舷給電レグの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯28の記録に残る。
cause: 零点母線の内部状態が境界での滞りを維持し、右舷給電レグへは同じ偏差を伝えない。
severity: 4
systems: power
derived:
  - FLT-057
components:
  - zpe_bus
triggers:
  - maneuver
role: bridge
confusers: []
discriminators:
  - 姿勢変更以外では零点母線の境界での滞りは再現しない。
