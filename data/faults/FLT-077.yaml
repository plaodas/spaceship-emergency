id: FLT-077
name: 右舷慣性ダンパーの位相のずれ
symptoms: 右舷慣性ダンパーの位相のずれが、シールド展開に基準から外れる。外れは右舷慣性ダンパーの監視点に留まり、左舷慣性ダンパーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯51の記録に残る。
cause: 右舷慣性ダンパーの内部状態が位相のずれを維持し、左舷慣性ダンパーへは同じ偏差を伝えない。
severity: 2
systems: gravity
derived:
  - FLT-022
components:
  - starboard_damper
triggers:
  - shield_on
role: local
confusers: []
discriminators:
  - シールド展開以外では右舷慣性ダンパーの位相のずれは再現しない。
