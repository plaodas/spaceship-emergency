id: FLT-037
name: 暗黒熱バスの共有点の飽和
symptoms: 暗黒熱バスの共有点の飽和が、対消滅の燃焼に基準から外れる。外れは暗黒熱バスの監視点に留まり、右舷暗黒熱弁の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯25の記録に残る。
cause: 暗黒熱バスの内部状態が共有点の飽和を維持し、右舷暗黒熱弁へは同じ偏差を伝えない。
severity: 1
systems: dark_thermal
derived:
  - FLT-045
components:
  - dark_thermal_bus
  - port_dark_valve
triggers:
  - during_burn
role: bridge
confusers: []
discriminators:
  - 対消滅の燃焼以外では暗黒熱バスの共有点の飽和は再現しない。
