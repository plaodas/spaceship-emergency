id: FLT-097
name: 右舷外板の開度不足
symptoms: 右舷外板の開度不足が、高出力の給電に基準から外れる。外れは右舷外板の監視点に留まり、左舷外板の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯66の記録に残る。
cause: 右舷外板の内部状態が開度不足を維持し、左舷外板へは同じ偏差を伝えない。
severity: 2
systems: hull
derived:
  - FLT-098
components:
  - starboard_hull
triggers:
  - high_power
role: local
confusers: []
discriminators:
  - 高出力の給電以外では右舷外板の開度不足は再現しない。
