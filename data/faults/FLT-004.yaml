id: FLT-004
name: 反物質消費センサーの指示の偏り
symptoms: 反物質消費センサーの指示の偏りが、姿勢変更に基準から外れる。外れは反物質消費センサーの監視点に留まり、位相センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯4の記録に残る。
cause: 反物質消費センサーの内部状態が指示の偏りを維持し、位相センサーへは同じ偏差を伝えない。
severity: 5
systems: sensors
derived:
  - FLT-005
components:
  - consumption_sensor
triggers:
  - maneuver
role: sensor_lie
confusers: []
discriminators:
  - 姿勢変更以外では反物質消費センサーの指示の偏りは再現しない。
