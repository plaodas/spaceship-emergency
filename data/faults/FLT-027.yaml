id: FLT-027
name: 左舷外板の時刻の一致
symptoms: 左舷外板の時刻の一致が、シールド展開に基準から外れる。外れは左舷外板の監視点に留まり、構造健全性フィールドの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯19の記録に残る。
cause: 左舷外板の内部状態が時刻の一致を維持し、構造健全性フィールドへは同じ偏差を伝えない。
severity: 5
systems: hull
derived:
  - FLT-043
components:
  - port_hull
triggers:
  - shield_on
role: confounder
confusers: []
discriminators:
  - シールド展開以外では左舷外板の時刻の一致は再現しない。
