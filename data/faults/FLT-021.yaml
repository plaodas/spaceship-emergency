id: FLT-021
name: ダークマター貯槽の別原因の重なり
symptoms: ダークマター貯槽の別原因の重なりが、通信ロックの維持に基準から外れる。外れはダークマター貯槽の監視点に留まり、逆止弁の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯13の記録に残る。
cause: ダークマター貯槽の内部状態が別原因の重なりを維持し、逆止弁へは同じ偏差を伝えない。
severity: 4
systems: dark_thermal
derived:
  - FLT-034
components:
  - dark_matter_reservoir
triggers:
  - comms_active
role: confounder
confusers: []
discriminators:
  - 通信ロックの維持以外ではダークマター貯槽の別原因の重なりは再現しない。
