id: FLT-036
name: 右舷折畳みコイルの境界での滞り
symptoms: 右舷折畳みコイルの境界での滞りが、定常運転に基準から外れる。外れは右舷折畳みコイルの監視点に留まり、左舷トリムコイルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯24の記録に残る。
cause: 右舷折畳みコイルの内部状態が境界での滞りを維持し、左舷トリムコイルへは同じ偏差を伝えない。
severity: 5
systems: fold
derived:
  - FLT-050
components:
  - starboard_fold_coil
  - mass_shadow_compensator
triggers:
  - steady
role: bridge
confusers: []
discriminators:
  - 定常運転以外では右舷折畳みコイルの境界での滞りは再現しない。
