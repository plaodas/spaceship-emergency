id: FLT-031
name: 右舷噴射格子の見かけの偏差
symptoms: 右舷噴射格子の見かけの偏差が、姿勢変更に基準から外れる。外れは右舷噴射格子の監視点に留まり、対消滅室の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯20の記録に残る。
cause: 右舷噴射格子の内部状態が見かけの偏差を維持し、対消滅室へは同じ偏差を伝えない。
severity: 1
systems: annihilation
derived:
  - FLT-032
components:
  - starboard_injector
triggers:
  - maneuver
role: confounder
confusers: []
discriminators:
  - 姿勢変更以外では右舷噴射格子の見かけの偏差は再現しない。
