id: FLT-007
name: 反物質消費センサーの基準点の移動
symptoms: 反物質消費センサーの基準点の移動が、熱パルスのあとに基準から外れる。外れは反物質消費センサーの監視点に留まり、位相センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯7の記録に残る。
cause: 反物質消費センサーの内部状態が基準点の移動を維持し、位相センサーへは同じ偏差を伝えない。
severity: 3
systems: sensors
derived:
  - FLT-011
components:
  - consumption_sensor
triggers:
  - after_heat_pulse
role: sensor_lie
confusers: []
discriminators:
  - 熱パルスのあと以外では反物質消費センサーの基準点の移動は再現しない。
