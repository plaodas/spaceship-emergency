id: FLT-067
name: 左舷噴射格子の位相のずれ
symptoms: 左舷噴射格子の位相のずれが、シールド展開に基準から外れる。外れは左舷噴射格子の監視点に留まり、右舷噴射格子の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯43の記録に残る。
cause: 左舷噴射格子の内部状態が位相のずれを維持し、右舷噴射格子へは同じ偏差を伝えない。
severity: 4
systems: annihilation
derived:
  - FLT-015
components:
  - port_injector
triggers:
  - shield_on
role: local
confusers: []
discriminators:
  - シールド展開以外では左舷噴射格子の位相のずれは再現しない。
