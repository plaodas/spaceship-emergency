id: FLT-064
name: 光子ノズルの脈動
symptoms: 光子ノズルの脈動が、対消滅の燃焼に基準から外れる。外れは光子ノズルの監視点に留まり、反物質磁気瓶の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯41の記録に残る。
cause: 光子ノズルの内部状態が脈動を維持し、反物質磁気瓶へは同じ偏差を伝えない。
severity: 2
systems: annihilation
derived:
  - FLT-066
components:
  - photon_nozzle
triggers:
  - during_burn
role: local
confusers: []
discriminators:
  - 対消滅の燃焼以外では光子ノズルの脈動は再現しない。
