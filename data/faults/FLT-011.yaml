id: FLT-011
name: 位相センサーの指示の偏り
symptoms: 位相センサーの指示の偏りが、定常運転に基準から外れる。外れは位相センサーの監視点に留まり、外板温度センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯8の記録に残る。
cause: 位相センサーの内部状態が指示の偏りを維持し、外板温度センサーへは同じ偏差を伝えない。
severity: 4
systems: sensors
derived:
  - FLT-012
components:
  - phase_sensor
triggers:
  - steady
role: sensor_lie
confusers: []
discriminators:
  - 定常運転以外では位相センサーの指示の偏りは再現しない。
