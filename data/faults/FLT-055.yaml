id: FLT-055
name: 擬似重力甲板の境界の脈動
symptoms: 擬似重力甲板の境界の脈動が、シールド展開に基準から外れる。外れは擬似重力甲板の監視点に留まり、右舷慣性ダンパーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯35の記録に残る。
cause: 擬似重力甲板の内部状態が境界の脈動を維持し、右舷慣性ダンパーへは同じ偏差を伝えない。
severity: 1
systems: gravity
derived:
  - FLT-063
components:
  - gravity_deck
  - port_damper
triggers:
  - shield_on
role: bridge
confusers: []
discriminators:
  - シールド展開以外では擬似重力甲板の境界の脈動は再現しない。
