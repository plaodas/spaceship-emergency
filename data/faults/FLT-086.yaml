id: FLT-086
name: 左舷シールドエミッタの脈動
symptoms: 左舷シールドエミッタの脈動が、対消滅の燃焼に基準から外れる。外れは左舷シールドエミッタの監視点に留まり、右舷シールドエミッタの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯57の記録に残る。
cause: 左舷シールドエミッタの内部状態が脈動を維持し、右舷シールドエミッタへは同じ偏差を伝えない。
severity: 3
systems: shield
derived:
  - FLT-087
components:
  - port_shield_emitter
triggers:
  - during_burn
role: local
confusers: []
discriminators:
  - 対消滅の燃焼以外では左舷シールドエミッタの脈動は再現しない。
