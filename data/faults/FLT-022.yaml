id: FLT-022
name: 擬似重力甲板の同時に見える揺れ
symptoms: 擬似重力甲板の同時に見える揺れが、折畳みの途中に基準から外れる。外れは擬似重力甲板の監視点に留まり、右舷慣性ダンパーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯14の記録に残る。
cause: 擬似重力甲板の内部状態が同時に見える揺れを維持し、右舷慣性ダンパーへは同じ偏差を伝えない。
severity: 5
systems: gravity
derived:
  - FLT-038
components:
  - gravity_deck
triggers:
  - during_jump
role: confounder
confusers: []
discriminators:
  - 折畳みの途中以外では擬似重力甲板の同時に見える揺れは再現しない。
