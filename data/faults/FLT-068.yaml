id: FLT-068
name: 質量影補償器の熱の滞留
symptoms: 質量影補償器の熱の滞留が、姿勢変更に基準から外れる。外れは質量影補償器の監視点に留まり、右舷折畳みコイルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯44の記録に残る。
cause: 質量影補償器の内部状態が熱の滞留を維持し、右舷折畳みコイルへは同じ偏差を伝えない。
severity: 5
systems: fold
derived:
  - FLT-069
components:
  - mass_shadow_compensator
triggers:
  - maneuver
role: local
confusers: []
discriminators:
  - 姿勢変更以外では質量影補償器の熱の滞留は再現しない。
