symptoms: デコヒーレンス遮蔽の内側で位相雑音が上がり、通信ロックが燃焼のあいだだけ落ちる。燃焼を止めるとロックは戻る。雑音の記録は遮蔽の入射計に残る。同じ偏差は当該部品の記録に残る。
cause: 遮蔽への入射が、燃焼中の位相雑音を上げる。
