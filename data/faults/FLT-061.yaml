id: FLT-061
name: 右舷慣性ダンパーの位相ずれ
symptoms: 通常空間へ戻った直後、右舷の慣性ダンパー位相がずれ、乗員の体が右舷側へ引かれる。牽引は復帰後の短い時間に限られる。この位相ずれだけでは外板温度は上がらず、反物質の使用量も増えない。
