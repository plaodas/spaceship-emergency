id: FLT-084
name: 零点母線の応答遅れ
symptoms: 零点母線の応答遅れが、定常運転に基準から外れる。外れは零点母線の監視点に留まり、右舷給電レグの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯56の記録に残る。
cause: 零点母線の内部状態が応答遅れを維持し、右舷給電レグへは同じ偏差を伝えない。
severity: 2
systems: power
derived:
  - FLT-010
components:
  - zpe_bus
triggers:
  - steady
role: local
confusers: []
discriminators:
  - 定常運転以外では零点母線の応答遅れは再現しない。
