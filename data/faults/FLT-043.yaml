id: FLT-043
name: 左舷外板の境界の脈動
symptoms: 左舷外板の境界の脈動が、熱パルスのあとに基準から外れる。外れは左舷外板の監視点に留まり、構造健全性フィールドの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯31の記録に残る。
cause: 左舷外板の内部状態が境界の脈動を維持し、構造健全性フィールドへは同じ偏差を伝えない。
severity: 2
systems: hull
derived:
  - FLT-093
components:
  - port_hull
  - starboard_hull
triggers:
  - after_heat_pulse
role: bridge
confusers: []
discriminators:
  - 熱パルスのあと以外では左舷外板の境界の脈動は再現しない。
