id: FLT-099
name: 構造健全性フィールドの熱の滞留
symptoms: 構造健全性フィールドの熱の滞留が、姿勢変更に基準から外れる。外れは構造健全性フィールドの監視点に留まり、右舷外板の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯68の記録に残る。
cause: 構造健全性フィールドの内部状態が熱の滞留を維持し、右舷外板へは同じ偏差を伝えない。
severity: 4
systems: hull
derived:
  - FLT-100
components:
  - hull_integrity_field
triggers:
  - maneuver
role: local
confusers: []
discriminators:
  - 姿勢変更以外では構造健全性フィールドの熱の滞留は再現しない。
