id: FLT-100
name: 右舷外板の同期外れ
symptoms: 右舷外板の同期外れが、通信ロックの維持に基準から外れる。外れは右舷外板の監視点に留まり、左舷外板の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯69の記録に残る。
cause: 右舷外板の内部状態が同期外れを維持し、左舷外板へは同じ偏差を伝えない。
severity: 5
systems: hull
derived:
  - FLT-027
components:
  - starboard_hull
triggers:
  - comms_active
role: local
confusers: []
discriminators:
  - 通信ロックの維持以外では右舷外板の同期外れは再現しない。
