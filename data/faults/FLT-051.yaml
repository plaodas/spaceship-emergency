id: FLT-051
name: 逆止弁の受け渡しの遅れ
symptoms: 逆止弁の受け渡しの遅れが、高出力の給電に基準から外れる。外れは逆止弁の監視点に留まり、暗黒熱バスの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯34の記録に残る。
cause: 逆止弁の内部状態が受け渡しの遅れを維持し、暗黒熱バスへは同じ偏差を伝えない。
severity: 5
systems: dark_thermal
derived:
  - FLT-072
components:
  - thermal_check_valve
  - starboard_dark_valve
triggers:
  - high_power
role: bridge
confusers: []
discriminators:
  - 高出力の給電以外では逆止弁の受け渡しの遅れは再現しない。
