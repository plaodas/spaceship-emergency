id: FLT-089
name: 右舷居住区ダクトの熱の滞留
symptoms: 右舷居住区ダクトの熱の滞留が、姿勢変更に基準から外れる。外れは右舷居住区ダクトの監視点に留まり、左舷居住区ダクトの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯60の記録に残る。
cause: 右舷居住区ダクトの内部状態が熱の滞留を維持し、左舷居住区ダクトへは同じ偏差を伝えない。
severity: 1
systems: life_support
derived:
  - FLT-090
components:
  - starboard_habitat_duct
triggers:
  - maneuver
role: local
confusers: []
discriminators:
  - 姿勢変更以外では右舷居住区ダクトの熱の滞留は再現しない。
