id: FLT-012
name: 外板温度センサーの校正のずれ
symptoms: 外板温度センサーの校正のずれが、対消滅の燃焼に基準から外れる。外れは外板温度センサーの監視点に留まり、反物質消費センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯9の記録に残る。
cause: 外板温度センサーの内部状態が校正のずれを維持し、反物質消費センサーへは同じ偏差を伝えない。
severity: 5
systems: sensors
derived:
  - FLT-014
components:
  - hull_temp_sensor
triggers:
  - during_burn
role: sensor_lie
confusers: []
discriminators:
  - 対消滅の燃焼以外では外板温度センサーの校正のずれは再現しない。
