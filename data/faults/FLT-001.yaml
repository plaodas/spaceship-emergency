id: FLT-001
name: 反物質消費センサーの校正のずれ
symptoms: 反物質消費センサーの校正のずれが、対消滅の燃焼に基準から外れる。外れは反物質消費センサーの監視点に留まり、位相センサーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯1の記録に残る。
cause: 反物質消費センサーの内部状態が校正のずれを維持し、位相センサーへは同じ偏差を伝えない。
severity: 2
systems: sensors
derived:
  - FLT-002
components:
  - consumption_sensor
triggers:
  - during_burn
role: sensor_lie
confusers: []
discriminators:
  - 対消滅の燃焼以外では反物質消費センサーの校正のずれは再現しない。
