id: FLT-015
name: 光子ノズルの時刻の一致
symptoms: 光子ノズルの時刻の一致が、シールド展開に基準から外れる。外れは光子ノズルの監視点に留まり、反物質磁気瓶の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯11の記録に残る。
cause: 光子ノズルの内部状態が時刻の一致を維持し、反物質磁気瓶へは同じ偏差を伝えない。
severity: 2
systems: annihilation
derived:
  - FLT-029
components:
  - photon_nozzle
triggers:
  - shield_on
role: confounder
confusers: []
discriminators:
  - シールド展開以外では光子ノズルの時刻の一致は再現しない。
