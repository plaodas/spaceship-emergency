id: FLT-069
name: 右舷折畳みコイルの同期外れ
symptoms: 右舷折畳みコイルの同期外れが、通信ロックの維持に基準から外れる。外れは右舷折畳みコイルの監視点に留まり、左舷トリムコイルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯45の記録に残る。
cause: 右舷折畳みコイルの内部状態が同期外れを維持し、左舷トリムコイルへは同じ偏差を伝えない。
severity: 1
systems: fold
derived:
  - FLT-070
components:
  - starboard_fold_coil
triggers:
  - comms_active
role: local
confusers: []
discriminators:
  - 通信ロックの維持以外では右舷折畳みコイルの同期外れは再現しない。
