id: FLT-076
name: 擬似重力甲板の開度不足
symptoms: 擬似重力甲板の開度不足が、高出力の給電に基準から外れる。外れは擬似重力甲板の監視点に留まり、右舷慣性ダンパーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯50の記録に残る。
cause: 擬似重力甲板の内部状態が開度不足を維持し、右舷慣性ダンパーへは同じ偏差を伝えない。
severity: 1
systems: gravity
derived:
  - FLT-077
components:
  - gravity_deck
triggers:
  - high_power
role: local
confusers: []
discriminators:
  - 高出力の給電以外では擬似重力甲板の開度不足は再現しない。
