id: FLT-058
name: 右舷シールドエミッタの受け渡しの遅れ
symptoms: 右舷シールドエミッタの受け渡しの遅れが、折畳みの途中に基準から外れる。外れは右舷シールドエミッタの監視点に留まり、左舷シールドエミッタの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯38の記録に残る。
cause: 右舷シールドエミッタの内部状態が受け渡しの遅れを維持し、左舷シールドエミッタへは同じ偏差を伝えない。
severity: 4
systems: shield
derived:
  - FLT-086
components:
  - starboard_shield_emitter
triggers:
  - during_jump
role: bridge
confusers: []
discriminators:
  - 折畳みの途中以外では右舷シールドエミッタの受け渡しの遅れは再現しない。
