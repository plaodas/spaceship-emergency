id: FLT-095
name: 構造健全性フィールドの脈動
symptoms: 構造健全性フィールドの脈動が、対消滅の燃焼に基準から外れる。外れは構造健全性フィールドの監視点に留まり、右舷外板の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯65の記録に残る。
cause: 構造健全性フィールドの内部状態が脈動を維持し、右舷外板へは同じ偏差を伝えない。
severity: 1
systems: hull
