id: FLT-056
name: もつれ対バンクの境界での滞り
symptoms: もつれ対バンクの境界での滞りが、姿勢変更に基準から外れる。外れはもつれ対バンクの監視点に留まり、位相ロックアレイの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯36の記録に残る。
cause: もつれ対バンクの内部状態が境界での滞りを維持し、位相ロックアレイへは同じ偏差を伝えない。
severity: 2
systems: comms
derived:
  - FLT-078
components:
  - entanglement_bank
  - decoherence_shield
triggers:
  - maneuver
role: bridge
confusers: []
discriminators:
  - 姿勢変更以外ではもつれ対バンクの境界での滞りは再現しない。
