id: FLT-025
name: 左舷シールドエミッタの別原因の重なり
symptoms: 左舷シールドエミッタの別原因の重なりが、対消滅の燃焼に基準から外れる。外れは左舷シールドエミッタの監視点に留まり、右舷シールドエミッタの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯17の記録に残る。
cause: 左舷シールドエミッタの内部状態が別原因の重なりを維持し、右舷シールドエミッタへは同じ偏差を伝えない。
severity: 3
systems: shield
derived:
  - FLT-041
components:
  - port_shield_emitter
triggers:
  - during_burn
role: confounder
confusers: []
discriminators:
  - 対消滅の燃焼以外では左舷シールドエミッタの別原因の重なりは再現しない。
