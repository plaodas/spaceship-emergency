id: FLT-060
name: 対消滅室右舷ジャケットの応答遅れ
symptoms: 対消滅室右舷ジャケットの応答遅れが、定常運転に基準から外れる。外れは対消滅室右舷ジャケットの監視点に留まり、光子ノズルの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯40の記録に残る。
cause: 対消滅室右舷ジャケットの内部状態が応答遅れを維持し、光子ノズルへは同じ偏差を伝えない。
