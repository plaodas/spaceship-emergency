id: FLT-093
name: 右舷外板の保持力の低下
symptoms: 右舷外板の保持力の低下が、熱パルスのあとに基準から外れる。外れは右舷外板の監視点に留まり、左舷外板の同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯63の記録に残る。
cause: 右舷外板の内部状態が保持力の低下を維持し、左舷外板へは同じ偏差を伝えない。
severity: 4
systems: hull
derived:
  - FLT-094
components:
  - starboard_hull
triggers:
  - after_heat_pulse
role: local
confusers: []
discriminators:
  - 熱パルスのあと以外では右舷外板の保持力の低下は再現しない。
