id: FLT-038
name: 擬似重力甲板の受け渡しの遅れ
symptoms: 擬似重力甲板の受け渡しの遅れが、高出力の給電に基準から外れる。外れは擬似重力甲板の監視点に留まり、右舷慣性ダンパーの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯26の記録に残る。
cause: 擬似重力甲板の内部状態が受け渡しの遅れを維持し、右舷慣性ダンパーへは同じ偏差を伝えない。
severity: 2
systems: gravity
derived:
  - FLT-055
components:
  - gravity_deck
  - port_damper
triggers:
  - high_power
role: bridge
confusers: []
discriminators:
  - 高出力の給電以外では擬似重力甲板の受け渡しの遅れは再現しない。
