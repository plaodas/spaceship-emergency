id: FLT-041
name: 左舷シールドエミッタの共有点の飽和
symptoms: 左舷シールドエミッタの共有点の飽和が、通信ロックの維持に基準から外れる。外れは左舷シールドエミッタの監視点に留まり、右舷シールドエミッタの同じ測点は基準内のままである。条件を外すと指示は基準へ戻り、監視帯29の記録に残る。
cause: 左舷シールドエミッタの内部状態が共有点の飽和を維持し、右舷シールドエミッタへは同じ偏差を伝えない。
severity: 5
systems: shield
derived:
  - FLT-054
components:
  - port_shield_emitter
triggers:
  - comms_active
role: bridge
confusers: []
discriminators:
  - 通信ロックの維持以外では左舷シールドエミッタの共有点の飽和は再現しない。
